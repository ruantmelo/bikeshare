services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: bikeshare
      POSTGRES_PASSWORD: bikeshare123
      POSTGRES_DB: bikeshare
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  pgdata:
